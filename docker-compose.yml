services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultis}
      POSTGRES_USER: ${POSTGRES_USER:-vaultis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultis}
    volumes:
      - ${POSTGRES_HOST_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vaultis} -d ${POSTGRES_DB:-vaultis}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8010}:${WEB_PORT:-8010}"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${DJANGO_TIME_ZONE:-UTC}
      WEB_PORT: ${WEB_PORT:-8010}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings_prod}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-use-a-real-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vaultis}
      POSTGRES_USER: ${POSTGRES_USER:-vaultis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultis}
      DATABASE_URL: postgres://${POSTGRES_USER:-vaultis}:${POSTGRES_PASSWORD:-vaultis}@db:5432/${POSTGRES_DB:-vaultis}
      NITROKEY_BACKUP_ROOT: ${NITROKEY_BACKUP_ROOT:-/app/data/backups/nitrokey}
    volumes:
      - ${VAULTIS_HOST_DATA_DIR:-./data}:/app/data
      - ${VAULTIS_SECRETS_DIR:-./secrets}:/app/secrets:ro
      # Arbor AED : hôte → chemins fixes dans le conteneur (voir ARBOR_AED_SOURCE_HOST_* / _DIR_*)
      - ${ARBOR_AED_SOURCE_HOST_DC01:-${ARBOR_AED_SOURCE_DIR_DC01:-/tmp/vaultis-arbor-dc01-skip}}:/app/arbor/incoming/dc01:ro
      - ${ARBOR_AED_SOURCE_HOST_DC02:-${ARBOR_AED_SOURCE_DIR_DC02:-/tmp/vaultis-arbor-dc02-skip}}:/app/arbor/incoming/dc02:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

