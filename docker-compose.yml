services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaultis}
      POSTGRES_USER: ${POSTGRES_USER:-vaultis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultis}
    volumes:
      - ${POSTGRES_HOST_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-vaultis} -d ${POSTGRES_DB:-vaultis}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build: .
    ports:
      - "${WEB_PORT:-8010}:${WEB_PORT:-8010}"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${DJANGO_TIME_ZONE:-UTC}
      WEB_PORT: ${WEB_PORT:-8010}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings_prod}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-use-a-real-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vaultis}
      POSTGRES_USER: ${POSTGRES_USER:-vaultis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultis}
      DATABASE_URL: postgres://${POSTGRES_USER:-vaultis}:${POSTGRES_PASSWORD:-vaultis}@db:5432/${POSTGRES_DB:-vaultis}
      NITROKEY_BACKUP_ROOT: ${NITROKEY_BACKUP_ROOT:-/app/data/backups/nitrokey}
      F5_BACKUP_ROOT: ${F5_BACKUP_ROOT:-/app/data/backups/f5}
      F5_DN1_BACKUP_ROOT: ${F5_DN1_BACKUP_ROOT:-/app/data/backups/f5-dn1}
      F5_DN2_BACKUP_ROOT: ${F5_DN2_BACKUP_ROOT:-/app/data/backups/f5-dn2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-7200}
      BACKUP_JOB_STALE_MINUTES: ${BACKUP_JOB_STALE_MINUTES:-30}
      # Arbor AED (chemins conteneur ; bind mount via volumes ci-dessous)
      ARBOR_AED_ACTIVE_DCS: ${ARBOR_AED_ACTIVE_DCS:-}
      ARBOR_AED_SOURCE_DIR_DC01: ${ARBOR_AED_SOURCE_DIR_DC01:-/app/arbor/incoming/dc01}
      ARBOR_AED_SOURCE_DIR_DC02: ${ARBOR_AED_SOURCE_DIR_DC02:-/app/arbor/incoming/dc02}
      ARBOR_AED_REMOTE_PARENT_DIR_DC01: ${ARBOR_AED_REMOTE_PARENT_DIR_DC01:-}
      ARBOR_AED_REMOTE_PARENT_DIR_DC02: ${ARBOR_AED_REMOTE_PARENT_DIR_DC02:-}
    volumes:
      - ${VAULTIS_HOST_DATA_DIR:-./data}:/app/data
      - ${VAULTIS_SECRETS_DIR:-./secrets}:/app/secrets:ro
      # F5 : dossier hôte des .ucs → F5_BACKUP_ROOT dans le conteneur
      - ${F5_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5}:/app/data/backups/f5
      - ${F5_DN1_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5-dn1}:/app/data/backups/f5-dn1
      - ${F5_DN2_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5-dn2}:/app/data/backups/f5-dn2
      # Arbor AED : hôte → chemins fixes dans le conteneur (voir ARBOR_AED_SOURCE_HOST_* / _DIR_*)
      - ${ARBOR_AED_SOURCE_HOST_DC01:-${ARBOR_AED_SOURCE_DIR_DC01:-/tmp/vaultis-arbor-dc01-skip}}:/app/arbor/incoming/dc01:ro
      - ${ARBOR_AED_SOURCE_HOST_DC02:-${ARBOR_AED_SOURCE_DIR_DC02:-/tmp/vaultis-arbor-dc02-skip}}:/app/arbor/incoming/dc02:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    entrypoint: ["/app/docker/scheduler-loop.sh"]
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${DJANGO_TIME_ZONE:-UTC}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings_prod}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me-use-a-real-secret-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-vaultis}
      POSTGRES_USER: ${POSTGRES_USER:-vaultis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaultis}
      DATABASE_URL: postgres://${POSTGRES_USER:-vaultis}:${POSTGRES_PASSWORD:-vaultis}@db:5432/${POSTGRES_DB:-vaultis}
      NITROKEY_BACKUP_ROOT: ${NITROKEY_BACKUP_ROOT:-/app/data/backups/nitrokey}
      F5_BACKUP_ROOT: ${F5_BACKUP_ROOT:-/app/data/backups/f5}
      F5_DN1_BACKUP_ROOT: ${F5_DN1_BACKUP_ROOT:-/app/data/backups/f5-dn1}
      F5_DN2_BACKUP_ROOT: ${F5_DN2_BACKUP_ROOT:-/app/data/backups/f5-dn2}
      BACKUP_SCHEDULER_INTERVAL_SECONDS: ${BACKUP_SCHEDULER_INTERVAL_SECONDS:-60}
      ARBOR_AED_ACTIVE_DCS: ${ARBOR_AED_ACTIVE_DCS:-}
      ARBOR_AED_SOURCE_DIR_DC01: ${ARBOR_AED_SOURCE_DIR_DC01:-/app/arbor/incoming/dc01}
      ARBOR_AED_SOURCE_DIR_DC02: ${ARBOR_AED_SOURCE_DIR_DC02:-/app/arbor/incoming/dc02}
      ARBOR_AED_REMOTE_PARENT_DIR_DC01: ${ARBOR_AED_REMOTE_PARENT_DIR_DC01:-}
      ARBOR_AED_REMOTE_PARENT_DIR_DC02: ${ARBOR_AED_REMOTE_PARENT_DIR_DC02:-}
    volumes:
      - ${VAULTIS_HOST_DATA_DIR:-./data}:/app/data
      - ${VAULTIS_SECRETS_DIR:-./secrets}:/app/secrets:ro
      - ${F5_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5}:/app/data/backups/f5
      - ${F5_DN1_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5-dn1}:/app/data/backups/f5-dn1
      - ${F5_DN2_BACKUP_HOST_DIR:-${VAULTIS_HOST_DATA_DIR:-./data}/backups/f5-dn2}:/app/data/backups/f5-dn2
      - ${ARBOR_AED_SOURCE_HOST_DC01:-${ARBOR_AED_SOURCE_DIR_DC01:-/tmp/vaultis-arbor-dc01-skip}}:/app/arbor/incoming/dc01:ro
      - ${ARBOR_AED_SOURCE_HOST_DC02:-${ARBOR_AED_SOURCE_DIR_DC02:-/tmp/vaultis-arbor-dc02-skip}}:/app/arbor/incoming/dc02:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

